<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Здоровая Спина</title>
<meta name="theme-color" content="#F4F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Спина">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one phone column; real-video cards on a quiet sage ground; ginger cat Tosya as the only illustration */
:root{
  --bg:#F4F6F3;--surface:#FFFFFF;--surface-2:#E8EEEA;--ink:#16302B;--muted:#5C716B;--line:#DCE4DF;
  --brand:#1F7A6B;--brand-2:#E3F1EC;--brand-ink:#FFFFFF;--cta:#FFB547;--cta-ink:#2A1B05;--cta-edge:#E39A2C;
  --done:#2FA37F;--warn:#C9482C;--warn-bg:#FBE6DF;--watch-bg:#FFF2D9;--watch-ink:#5A3D00;--shadow:rgba(22,48,43,.10);
  --font-d:"Unbounded","Onest",system-ui,sans-serif;
  --font-b:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A18;--surface:#172623;--surface-2:#20332F;--ink:#E6F0EC;--muted:#9DB3AC;--line:#2A403B;
  --brand:#3FB59E;--brand-2:#1B3631;--brand-ink:#08201B;--cta:#FFC062;--cta-ink:#2A1B05;--cta-edge:#C98422;
  --done:#3FB59E;--warn:#FF8C6B;--warn-bg:#3A2420;--watch-bg:#3A3018;--watch-ink:#FFE3A6;--shadow:rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A18;--surface:#172623;--surface-2:#20332F;--ink:#E6F0EC;--muted:#9DB3AC;--line:#2A403B;
  --brand:#3FB59E;--brand-2:#1B3631;--brand-ink:#08201B;--cta:#FFC062;--cta-ink:#2A1B05;--cta-edge:#C98422;
  --done:#3FB59E;--warn:#FF8C6B;--warn-bg:#3A2420;--watch-bg:#3A3018;--watch-ink:#FFE3A6;--shadow:rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 6px) calc(110px + env(safe-area-inset-bottom,0px))}

.top{display:flex;align-items:center;justify-content:space-between;padding-block:8px 12px}
.brand{font-family:var(--font-d);font-weight:700;font-size:17px;display:flex;align-items:center;gap:9px}
.brand .av{width:34px;height:34px;border-radius:12px;background:var(--brand-2);overflow:hidden;display:grid;place-items:end center}
.brand .av svg{width:40px;margin-bottom:-14px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--brand)}
.iconbtn svg{width:22px;height:22px}

.hero{background:var(--brand);color:#fff;border-radius:28px;padding:20px 0 0 20px;display:grid;grid-template-columns:minmax(0,1fr) 138px;align-items:end;overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;right:-40px;top:-50px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-text{padding-bottom:20px;display:grid;gap:10px;position:relative}
.hero-name{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.bubble{background:#fff;color:#16302B;border-radius:18px 18px 18px 6px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.3}
.hero .mascot{width:150px;margin:0 -12px -6px 0;position:relative}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:var(--surface);border-radius:20px;padding:12px;display:grid;gap:2px}
.stat .ic{width:22px;height:22px;color:var(--brand)}
.stat .ic.fl{color:#F08A2C}
.stat b{font-family:var(--font-d);font-size:20px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;font-weight:600;line-height:1.2}
.card{background:var(--surface);border-radius:20px;padding:14px}
.week{margin-top:10px;display:grid;gap:10px}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.week-head b{font-weight:800}
.week-head span{color:var(--muted);font-size:13px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;justify-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:#fff}
.day.done i{background:var(--done)}
.day.done i svg{width:16px;height:16px}
.day.today i{box-shadow:0 0 0 2px var(--brand)}

.sec-title{font-size:16px;margin:28px 0 4px}
.lead{color:var(--muted);font-size:14px;font-weight:500;margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}

.thumb{position:relative;border-radius:16px;overflow:hidden;background:var(--surface-2);aspect-ratio:16/10;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .pl{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.thumb .pl svg{width:14px;height:14px;margin-left:2px}
.thumb.sq{aspect-ratio:1}

.daily{width:100%;text-align:left;border:0;background:var(--surface);border-radius:24px;padding:10px;display:grid;gap:12px;margin-top:8px}
.daily .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 6px 6px}
.daily h3{font-size:18px;margin:3px 0 4px}
.daily p{color:var(--muted);font-size:14px;font-weight:500}
.go{display:inline-flex;align-items:center;gap:6px;background:var(--cta);color:var(--cta-ink);font-weight:800;border-radius:999px;padding:10px 16px 10px 12px;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--cta-edge)}
.go svg{width:18px;height:18px}
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;aspect-ratio:16/9;max-width:100%}
.collage .thumb{aspect-ratio:auto;border-radius:14px}
.collage .thumb:first-child{grid-row:1/3}

.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;padding-bottom:6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:0 0 190px;scroll-snap-align:start;border:0;background:var(--surface);border-radius:20px;padding:8px 8px 12px;text-align:left;display:grid;gap:6px;align-content:start}
.pcard b{font-weight:800;font-size:15px;line-height:1.2;padding:4px 4px 0}
.pcard small{color:var(--muted);font-weight:500;font-size:13px;line-height:1.3;padding:0 4px}
.row-cards{display:grid;gap:10px}
.lcard{width:100%;border:0;background:var(--surface);border-radius:18px;padding:8px;display:grid;grid-template-columns:96px minmax(0,1fr) 22px;gap:12px;align-items:center;text-align:left}
.lcard b{font-weight:800;display:block}
.lcard small{color:var(--muted);font-weight:500;font-size:13px}
.chev{width:22px;height:22px;color:var(--muted)}

.safety{width:100%;margin-top:28px;text-align:left;background:var(--surface);border-radius:20px;padding:14px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;border:1.5px solid var(--brand)}
.safety i{width:44px;height:44px;border-radius:14px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.safety i svg{width:24px;height:24px}
.safety b{display:block;font-weight:800}
.safety small{color:var(--muted);font-weight:500;font-size:13px}
.tip{margin-top:12px;background:var(--surface-2);border-radius:18px;padding:14px;display:grid;gap:8px;font-size:14px;font-weight:500}
.tip b{font-weight:800}
.tip button{justify-self:start;border:0;background:transparent;color:var(--brand);font-weight:800;padding:0}

h1.page{font-size:22px;margin-top:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.secard{border:0;background:var(--surface);border-radius:20px;padding:8px 8px 12px;text-align:left;display:grid;gap:6px;align-content:start}
.secard b{font-weight:800;font-size:15px;line-height:1.2;padding:4px 4px 0}
.secard small{color:var(--muted);font-weight:500;font-size:12.5px;line-height:1.3;padding:0 4px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tab{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:12px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-2)}

.sheet{position:fixed;inset:0;z-index:30;display:grid;align-items:end}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,20,18,.5)}
.panel{position:relative;background:var(--bg);border-radius:26px 26px 0 0;max-height:94vh;max-height:94dvh;overflow:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:0 auto;animation:up .28s ease;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel-bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 0 8px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line)}
.panel-bar .iconbtn{width:38px;height:38px;color:var(--ink)}
.backbtn{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.sh-head h2{font-size:21px;margin:12px 0 4px}
.sh-head p{color:var(--muted);font-weight:500;font-size:14px}
.panel h3{font-size:12.5px;font-weight:700;margin:20px 0 8px;font-family:var(--font-b);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.bad[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.note{margin-top:10px;border-radius:14px;padding:12px;font-size:14px;font-weight:500;background:var(--surface-2)}
.note.warn{background:var(--warn-bg);border:1.5px solid var(--warn)}
.note b{font-weight:800}
.exlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.exitem{width:100%;border:0;background:var(--surface);border-radius:16px;padding:7px;display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left}
.exitem .thumb{border-radius:11px}
.exitem b{font-weight:700;font-size:15px;display:block;line-height:1.25}
.exitem small{color:var(--muted);font-weight:500;font-size:12.5px}
.exitem .cnt{font-weight:800;font-size:13px;color:var(--brand);font-variant-numeric:tabular-nums;padding-right:6px}
.exitem.out{opacity:.5}
.sh-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:14px 0 calc(24px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-24px - env(safe-area-inset-bottom,0px))}
.btn{width:100%;border:0;border-radius:18px;padding:16px;background:var(--cta);color:var(--cta-ink);font-family:var(--font-d);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 var(--cta-edge)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--cta-edge)}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line)}

.video{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vnote{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:6px}
.detail h2{font-size:22px;margin:14px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--surface);color:var(--muted)}
.tag.lv{color:var(--brand)}
ol.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;background:var(--surface);border-radius:14px;padding:10px;font-weight:500}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.callout{border-radius:14px;padding:12px;font-weight:500;font-size:14.5px;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px}
.callout svg{width:22px;height:22px}
.callout.watch{background:var(--watch-bg);color:var(--watch-ink)}
.callout.why{background:var(--surface);border:1.5px solid var(--brand)}
.callout.why svg{color:var(--brand)}
.prose{display:grid;gap:10px;font-size:15px}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.prose b{font-weight:800}

.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);overflow:auto}
.player>*{width:100%;max-width:520px;margin-inline:auto}
.pl-top{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:12px;align-items:center}
.pl-top .iconbtn{color:var(--ink)}
.pl-prog{display:grid;gap:5px}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.segs i.d{background:var(--done)}
.segs i.c{background:var(--brand)}
.pl-meta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pl-media{margin-top:12px;position:relative}
.pl-media .poster{position:absolute;inset:0;background:var(--surface-2)}
.pl-media .poster img{width:100%;height:100%;object-fit:cover;filter:saturate(.7) brightness(.75)}
.pl-media .poster span{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:5px 11px}
.pl-side{position:absolute;left:10px;bottom:10px;font-size:12px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:5px 11px;z-index:2}
.coach{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:end;margin-top:10px}
.coach .mascot{width:62px}
.coach .bubble{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--shadow);margin-bottom:8px}
.pl-info{text-align:center;padding-top:6px;display:grid;gap:3px}
.pl-kind{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.pl-info h2{font-size:20px}
.pl-time{font-family:var(--font-d);font-weight:700;font-size:52px;line-height:1.05;font-variant-numeric:tabular-nums}
.pl-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:4px auto 0;max-width:280px;width:100%}
.pl-bar i{display:block;height:100%;background:var(--cta);border-radius:4px;width:0}
.pl-cue{color:var(--muted);font-weight:600;font-size:14.5px;max-width:420px;margin:6px auto 0}
.pl-ctrl{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:12px}
.cbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.cbtn svg{width:26px;height:26px}
.cbtn.main{width:76px;height:76px;background:var(--brand);color:var(--brand-ink)}
.cbtn.main svg{width:34px;height:34px}
.pl-pain{margin:10px auto 0;display:block;border:0;background:transparent;color:var(--warn);font-weight:700;font-size:14px;padding:6px 10px;width:auto}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(8,20,18,.55)}
.modal .box{background:var(--bg);border-radius:24px;padding:20px;max-width:380px;width:100%;display:grid;gap:10px}
.modal h3{font-size:18px}
.modal p{color:var(--muted);font-weight:500;font-size:15px}

.finish{position:fixed;inset:0;z-index:50;background:var(--brand);color:#fff;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
.finish .in{max-width:460px;margin:0 auto;display:grid;gap:14px;text-align:center}
.finish .mascot{width:180px;margin:0 auto;display:block}
.finish h2{font-size:26px}
.fin-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fin-stats div{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 6px}
.fin-stats b{display:block;font-family:var(--font-d);font-size:20px;font-variant-numeric:tabular-nums}
.fin-stats small{font-weight:600;font-size:12px;opacity:.85}
.fin-badge{background:#fff;color:#16302B;border-radius:18px;padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;text-align:left}
.fin-badge b{font-weight:800;display:block}
.fin-badge small{color:#5C716B;font-weight:500}
.lvbox{background:rgba(255,255,255,.14);border-radius:18px;padding:12px;text-align:left;display:grid;gap:8px}
.lvbox .bar,.lvcard .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.lvbox .bar i,.lvcard .bar i{display:block;height:100%;background:var(--cta);border-radius:5px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}

.lvcard{background:var(--brand);color:#fff;border-radius:24px;padding:16px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;margin-top:10px}
.lvcard .num{width:72px;height:72px;border-radius:22px;background:var(--cta);color:var(--cta-ink);display:grid;place-items:center;font-family:var(--font-d);font-size:28px;font-weight:700}
.lvcard b{font-family:var(--font-d);font-size:18px;display:block;margin:2px 0 8px}
.lvcard small{font-weight:600;font-size:13px;opacity:.9}
.lvcard .bar{margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase}
.cal i{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cal i.on{background:var(--done);color:#fff}
.cal i.now{box-shadow:inset 0 0 0 2px var(--brand)}
.cal i.fut{opacity:.35}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.badge{background:var(--surface);border-radius:18px;padding:12px 8px;display:grid;justify-items:center;gap:6px;text-align:center}
.badge svg{width:52px;height:52px}
.badge b{font-size:13px;font-weight:800;line-height:1.2}
.badge small{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.25}
.badge.locked svg{filter:grayscale(1);opacity:.35}
.badge.locked b{color:var(--muted)}
.sync{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:14px;text-align:center}


/* v3 layout */
.greet{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:end;background:var(--brand);border-radius:24px;padding:14px 14px 0 6px;overflow:hidden}
.greet .mascot{width:104px;margin-bottom:-6px}
.greet-body{display:grid;gap:8px;padding-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.pill svg{width:14px;height:14px}
.pill b{font-weight:800}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 4px}
.sec-head h2{font-size:17px}
.sec-head span{color:var(--muted);font-size:12.5px;font-weight:600}
.dcard{flex:0 0 200px;scroll-snap-align:start;border:0;background:var(--surface);border-radius:20px;padding:8px 8px 12px;text-align:left;display:grid;gap:5px;align-content:start;position:relative}
.dcard b{font-weight:800;font-size:15px;line-height:1.2;padding:2px 4px 0}
.dcard small{color:var(--muted);font-weight:500;font-size:12.5px;line-height:1.3;padding:0 4px}
.tagp{position:absolute;left:14px;top:14px;background:var(--cta);color:var(--cta-ink);font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.part{border:0;background:var(--surface);border-radius:20px;padding:8px 8px 12px;text-align:left;display:grid;gap:5px;align-content:start}
.part b{font-family:var(--font-d);font-weight:700;font-size:14.5px;line-height:1.2;padding:4px 4px 0}
.part small{color:var(--muted);font-weight:500;font-size:12px;line-height:1.35;padding:0 4px}
.part.lib .thumb img{filter:saturate(.4)}
.pagehead{padding-block:2px 6px}
.backbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--surface);border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;font-size:14px}
.backbtn svg{width:18px;height:18px}
.subs{display:grid;gap:12px;margin-top:6px}
.sub{border:0;background:var(--surface);border-radius:22px;padding:8px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.sub .strip{grid-column:1/-1}
.sub-body{padding:2px 6px 6px;display:grid;gap:3px}
.sub-body b{font-family:var(--font-d);font-weight:700;font-size:17px;line-height:1.2}
.sub-body p{color:var(--ink);font-weight:500;font-size:14px;opacity:.85}
.sub-body small{color:var(--brand);font-weight:700;font-size:12.5px}
.sub .go{width:46px;height:46px;padding:0;justify-content:center;margin-right:6px}
.sub .go svg{width:20px;height:20px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;border-radius:16px;overflow:hidden}
.strip .thumb{border-radius:0;aspect-ratio:4/3}
.strip.big .thumb{aspect-ratio:1}
.grp{font-family:var(--font-b);font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
.benefit{display:inline-block;background:var(--brand-2);color:var(--brand);font-weight:700;font-size:14px;border-radius:12px;padding:6px 10px;margin-bottom:8px}
.src{font-size:14px}
.src a{color:var(--brand);font-weight:600}
.safety .chev{margin-left:auto}
.safety{grid-template-columns:44px minmax(0,1fr) 22px}

/* mascot motion */
.mascot .m-wave{transform-origin:124px 148px;animation:wave 1.3s ease-in-out infinite}
.mascot .m-tail{transform-origin:130px 188px;animation:tail 2.6s ease-in-out infinite}
.mascot .m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.m-cheer .m-body{animation:hop .9s ease-in-out infinite}
.m-calm .m-body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media (prefers-reduced-motion: reduce){.mascot *{animation:none!important}.panel{animation:none}}
@media (max-height:680px){.pl-time{font-size:42px}.coach{display:none}.cbtn.main{width:64px;height:64px}}

const KEY='zdorovaya-spina-v2';
let store={log:[],settings:{sound:true,mode:'normal'},tipHidden:false};
function mergeIn(s){if(!s||typeof s!=='object')return;store=Object.assign({log:[],tipHidden:false},s);store.settings=Object.assign({sound:true,mode:'normal'},s.settings||{});if(!Array.isArray(store.log))store.log=[]}
try{mergeIn(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
let cloudTimer=0;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}
  if(!hasCloud)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>{try{
    const s=JSON.stringify(store);const parts=[];for(let i=0;i<s.length;i+=3500)parts.push(s.slice(i,i+3500));
    parts.forEach((p,i)=>TG.CloudStorage.setItem('c'+i,p));
    TG.CloudStorage.setItem('n',String(parts.length));
  }catch(e){}},300);
}
function loadCloud(){
  if(!hasCloud)return;
  try{TG.CloudStorage.getItem('n',(err,n)=>{
    n=parseInt(n,10);if(err||!n)return save();
    const keys=Array.from({length:n},(_,i)=>'c'+i);
    TG.CloudStorage.getItems(keys,(err2,vals)=>{
      if(err2||!vals)return;
      try{const cloud=JSON.parse(keys.map(k=>vals[k]||'').join(''));
        if(cloud&&Array.isArray(cloud.log)&&cloud.log.length>=store.log.length){mergeIn(cloud);try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}if(!PL.timer)render()}
        else save();
      }catch(e){}
    });
  })}catch(e){}
}

const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;return addDays(x,-w)};
function stats(){
  const log=store.log||[];const days=new Set(log.map(l=>l.d));
  let min=0,maxMin=0,early=false;const cat={neck:0,upper:0,core:0,legs:0,relax:0,daily:0};const secs=new Set();const weeks={};
  log.forEach(l=>{min+=l.min;maxMin=Math.max(maxMin,l.min);if(new Date(l.ts).getHours()<9)early=true;cat[l.cat]=(cat[l.cat]||0)+1;if(l.cat&&l.cat!=='daily')secs.add(l.cat);
    const wk=dkey(monday(new Date(l.ts)));weeks[wk]=(weeks[wk]||0)+1});
  const now=new Date();let d=days.has(dkey(now))?now:addDays(now,-1);let cur=0;while(days.has(dkey(d))){cur++;d=addDays(d,-1)}
  const sorted=[...days].sort();let best=0,run=0,prev=null;
  sorted.forEach(k=>{const dt=new Date(k+'T12:00:00');if(prev&&Math.round((dt-prev)/864e5)===1)run++;else run=1;best=Math.max(best,run);prev=dt});

/* ============ plan builder ============ */
function buildPlan(sub,minutes,mode,pain){
  const soft=mode==='soft'||pain==='ache';
  const W=soft?30:40,R=soft?20:15,T=10;
  if(pain==='bad'){
    return[{type:'prep',ex:'breathing',dur:8},{type:'work',ex:'breathing',dur:90,phase:'Расслабление'},{type:'rest',ex:'breathing',dur:T},{type:'work',ex:'breathing',dur:90,phase:'Расслабление'}];
  }
  let list=sub.ex.filter(id=>EX[id]);
  if(pain==='ache') list=list.filter(id=>EX[id].lvl===1&&!EX[id].opt);
  if(!list.length) list=['breathing','bridge'];
  const exDur=id=>{const base=EX[id].id==='breathing'?45:W;return EX[id].sides==='split'?Math.round(base*1.5/5)*5:base};
  const steps=[];
  let warm=[];
  if(minutes>=10&&!list.includes('shoulderRolls')&&!list.includes('seatedMarch')) warm=['shoulderRolls','seatedMarch'];
  warm.forEach(id=>{if(steps.length)steps.push({type:'rest',dur:T});steps.push({type:'work',ex:id,dur:30,phase:'Разминка'})});
  let used=8+steps.reduce((a,s)=>a+s.dur,0);
  const budget=minutes*60;
  let round=0;
  while(round<12){
    for(let k=0;k<list.length;k++){
      const id=list[k],d=exDur(id);
      if(round>0&&used+R+d>budget+20)return finish();
      if(steps.length){steps.push({type:'rest',dur:R});used+=R}
      steps.push({type:'work',ex:id,dur:d,phase:round===0?'Упражнение':'Круг '+(round+1)});used+=d;
    }
    round++;
    if(used>=budget-20)break;
  }
  return finish();
  function finish(){
    for(let i=0;i<steps.length;i++){if(steps[i].type==='rest')steps[i].ex=steps[i+1].ex}
    steps.unshift({type:'prep',ex:steps[0].ex,dur:8});
    return steps;
  }
}

      <p>Упражнения проверены по исследованиям и клиническим рекомендациям при хронической боли в пояснице и дегенерации дисков (так в западной медицине называют остеохондроз), а также при сутулости и выдвинутой вперёд голове.</p>
      <h3>Что говорят исследования</h3>
      <ul>
        <li><b>Лечебная физкультура работает:</b> боль в среднем уменьшается через 6–12 недель регулярных занятий. Если бросить, эффект постепенно уходит.</li>
        <li><b>Упражнения на контроль корпуса</b> (птица-собака, жук, боковая планка) уменьшают боль и улучшают подвижность.</li>
        <li><b>Сильные ягодицы</b> разгружают поясницу: добавление упражнений на бёдра улучшало результат.</li>
        <li><b>Против холки</b> лучше всего работает комплекс: подбородок назад, сведение лопаток, растяжка грудных и верха плеч, подъёмы рук лёжа. Результат — через 8 недель и больше, 3–5 раз в неделю.</li>
      </ul>
      <h3>Как заниматься</h3>
      <ul>
        <li>Двигайся медленно, без рывков. Дыши, не задерживай дыхание.</li>
        <li>Лёгкий дискомфорт, который проходит за сутки, — нормально. <b>Боль, которая усиливается или отдаёт в ногу, — сигнал остановиться.</b></li>
        <li>Первые две недели выбирай темп «Мягко». Жук, планки и мост на одной ноге — после того как базовые упражнения даются легко.</li>
        <li>Упражнения со сгибанием поясницы («Мягкая кошка», «Колено к груди») делай только если они приносят облегчение.</li>
        <li>Добавь ходьбу 20–30 минут в большинство дней.</li>
      </ul>
      <h3>Срочно к врачу</h3>
      <div class="note warn">Онемение в паху или промежности, проблемы с мочеиспусканием, нарастающая слабость или онемение в ноге, боль ниже колена, температура, ночные боли, необъяснимая потеря веса, боль после травмы. Во время обострения не тренируйся.</div>
      <h3>Чего здесь нет и почему</h3>
      <ul>
        <li><b>Скручиваний, подъёмов корпуса, наклонов с прямыми ногами</b> — сильно давят на диски.</li>
        <li><b>Прыжков и бега</b> — ударная нагрузка.</li>
        <li><b>Скручиваний корпуса, «лодочки», глубоких прогибов, веса над головой.</b></li>
      </ul>
      <h3>Научная основа</h3>
      <ul class="src">${src.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join('')}</ul>
      <p class="vnote">Приложение не заменяет врача. Покажи список упражнений неврологу или инструктору ЛФК: он подтвердит, что они подходят именно тебе.</p>
    </div>`;
  $('#panel').scrollTop=0;
}
/* ============ sound ============ */
let AC=null;
function beep(f,d){if(!store.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.13));o.start(t);o.stop(t+(d||.13)+.03)}catch(e){}}
function say(t){if(!store.settings.sound)return;try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=1.02;speechSynthesis.speak(u)}catch(e){}}
let wake=null;
async function wakeOn(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
function wakeOff(){try{if(wake)wake.release()}catch(e){}wake=null}

/* ============ player ============ */
const PL={timer:null};
function ytCmd(func){try{const f=$('#plVid');if(f&&f.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),'*')}catch(e){}}
function plStart(steps,meta){
  Object.assign(PL,{steps,meta,i:0,rem:0,paused:false,last:performance.now(),elapsed:0,half:false,bubbleAt:0,lastWhole:99,curYt:null});
  PL.works=steps.filter(s=>s.type==='work').length;let wi=0;steps.forEach(s=>{if(s.type==='work')s.wi=wi++;else s.wi=wi});
  $('#player').innerHTML=`
    <div class="pl-top"><button class="iconbtn" data-a="pl-close" aria-label="Завершить">${IC.close}</button>
      <div class="pl-prog"><div class="segs" id="plSegs">${steps.filter(s=>s.type==='work').map(()=>'<i></i>').join('')}</div><div class="pl-meta"><span id="plCount"></span><span id="plLeft"></span></div></div>
      <button class="iconbtn" data-a="pl-sound" id="plSound" aria-label="Звук"></button></div>
    <div class="pl-media"><div class="video"><iframe id="plVid" title="Видео упражнения" allow="autoplay; encrypted-media; picture-in-picture" src="about:blank"></iframe><div class="poster" id="plPoster" hidden><img id="plPosterImg" alt="" onerror="this.style.opacity=0" onload="this.style.opacity=1"><span id="plPosterTxt"></span></div></div><span class="pl-side" id="plSide" hidden></span></div>
    <div class="coach"><div id="plMascot"></div><p class="bubble" id="plBubble"></p></div>
    <div class="pl-info"><span class="pl-kind" id="plKind"></span><h2 id="plName"></h2><div class="pl-time" id="plTime"></div><div class="pl-bar"><i id="plBar"></i></div><p class="pl-cue" id="plCue"></p></div>
    <div class="pl-ctrl"><button class="cbtn" data-a="pl-prev" aria-label="Назад">${IC.prev}</button><button class="cbtn main" data-a="pl-toggle" id="plToggle" aria-label="Пауза">${IC.pause}</button><button class="cbtn" data-a="pl-next" aria-label="Дальше">${IC.next}</button></div>
    <button class="pl-pain" data-a="pl-pain">Неприятно или больно?</button>`;
  $('#player').hidden=false;document.body.classList.add('lock');backBtn(false);
  setSoundIcon();wakeOn();
  plLoad(0);
  PL.timer=setInterval(plTick,200);
}
function setSoundIcon(){const b=$('#plSound');if(b){b.innerHTML=store.settings.sound?IC.sound:IC.mute;b.setAttribute('aria-label',store.settings.sound?'Выключить звук':'Включить звук')}}
let mascotState='';
function setMascot(st){if(st===mascotState)return;mascotState=st;$('#plMascot').innerHTML=mascot(st)}
function plLoad(i){
  PL.i=i;const s=PL.steps[i];const ex=EX[s.ex];
  PL.rem=s.dur;PL.half=false;PL.lastWhole=99;PL.stepStart=PL.elapsed;
  const vid=$('#plVid'),poster=$('#plPoster');
  if(s.type==='work'){
    poster.hidden=true;
    if(PL.curYt!==ex.yt){PL.curYt=ex.yt;vid.src=embedUrl(ex.yt,{autoplay:1,mute:1,loop:1,playlist:ex.yt,controls:0})}
    else if(!PL.paused) ytCmd('playVideo');
    setMascot('hello');
  }else{
    if(PL.curYt){PL.curYt=null;vid.src='about:blank'}
    $('#plPosterImg').src=thumbUrl(ex.yt);$('#plPosterTxt').textContent=s.type==='prep'?'Первое упражнение':'Следующее';
    poster.hidden=false;setMascot('calm');
  }
  const kindEl=$('#plKind');
  kindEl.textContent=s.type==='prep'?'Приготовься':s.type==='rest'?'Отдых':s.phase;
  $('#plName').textContent=ex.name;
  $('#plCue').textContent=s.type==='work'?ex.cue:'Исходное положение: '+ex.steps[0].charAt(0).toLowerCase()+ex.steps[0].slice(1);
  const side=$('#plSide');
  if(s.type==='work'&&ex.sides){side.hidden=false;side.textContent=ex.sides==='alt'?'Чередуй стороны':'Сначала одна сторона'}else side.hidden=true;
  [...document.querySelectorAll('#plSegs i')].forEach((g,k)=>{g.className=k<s.wi?'d':(k===s.wi&&s.type==='work')?'c':''});
  $('#plCount').textContent=`Упражнение ${Math.min(s.wi+1,PL.works)} из ${PL.works}`;
  if(s.type==='prep'){setBubble(pick(PH.start));say('Приготовься. '+ex.name)}
  else if(s.type==='rest'){setBubble(pick(PH.rest));say('Отдых. Дальше: '+ex.name)}
  else{setBubble(pick(PH.mid));beep(1046,.22);haptic('medium');setTimeout(()=>say(ex.name),250)}
  PL.bubbleAt=PL.elapsed;
  plRender();
}
function setBubble(t){const b=$('#plBubble');if(b)b.textContent=t}
function plRender(){
  const s=PL.steps[PL.i];if(!s)return;
  $('#plTime').textContent=fmt(PL.rem);
  $('#plBar').style.width=(100*(1-PL.rem/s.dur)).toFixed(1)+'%';
  let left=PL.rem;for(let k=PL.i+1;k<PL.steps.length;k++)left+=PL.steps[k].dur;
  $('#plLeft').textContent='Осталось '+fmt(left);
}
function plTick(){
  const now=performance.now();const dt=Math.min(1,(now-PL.last)/1000);PL.last=now;
  if(PL.paused)return;
  PL.rem-=dt;PL.elapsed+=dt;
  const s=PL.steps[PL.i];const ex=EX[s.ex];
  const whole=Math.ceil(PL.rem);
  if(whole!==PL.lastWhole){PL.lastWhole=whole;if(whole<=3&&whole>=1){beep(660,.1);haptic('light')}}
  if(s.type==='work'){
    if(ex.sides==='split'&&!PL.half&&PL.rem<=s.dur/2){PL.half=true;setBubble('Смени сторону!');say('Смени сторону');beep(880,.18);haptic('heavy');const sd=$('#plSide');if(sd)sd.textContent='Теперь другая сторона';PL.bubbleAt=PL.elapsed}
    else if(PL.rem<=6&&PL.rem>5.6){setBubble(pick(PH.end));setMascot('cheer');PL.bubbleAt=PL.elapsed}
    else if(PL.elapsed-PL.bubbleAt>11&&PL.rem>8){setBubble(pick(PH.mid));PL.bubbleAt=PL.elapsed}
  }
  if(PL.rem<=0){if(PL.i<PL.steps.length-1)plLoad(PL.i+1);else{plFinish(true);return}}
  plRender();
}
function plStop(){clearInterval(PL.timer);PL.timer=null;wakeOff();try{speechSynthesis.cancel()}catch(e){}const v=$('#plVid');if(v)v.src='about:blank';$('#player').hidden=true;$('#player').innerHTML='';mascotState='';document.body.classList.remove('lock')}
function plToggle(force){
  PL.paused=force!==undefined?force:!PL.paused;PL.last=performance.now();
  const b=$('#plToggle');b.innerHTML=PL.paused?IC.play:IC.pause;b.setAttribute('aria-label',PL.paused?'Продолжить':'Пауза');
  if(PL.paused){ytCmd('pauseVideo');setBubble('Пауза. Отдохни, сколько нужно.');setMascot('calm')}else{ytCmd('playVideo');setBubble(pick(PH.mid))}
}
let finCleanup=null;
function plFinish(done){
  const minutes=Math.max(1,Math.round(PL.elapsed/60));
  const before=stats();const gotBefore=new Set(BADGES.filter(b=>b.t(before)).map(b=>b.id));const lvBefore=level(before.min*10);
  const works=PL.steps.slice(0,PL.i+1).filter(s=>s.type==='work').length;
  const meta=PL.meta;
  plStop();
  const d=new Date();
  store.log.push({d:dkey(d),ts:d.getTime(),min:minutes,id:meta.id,kind:meta.kind,cat:meta.cat});save();
  const after=stats();const lv=level(after.min*10);const fresh=BADGES.filter(b=>b.t(after)&&!gotBefore.has(b.id));
  const pct=lv.to?Math.round(100*(lv.xp-lv.from)/(lv.to-lv.from)):100;
  say(done?'Тренировка завершена. Ты умница!':'Отличная работа!');haptic('success');
  $('#finish').innerHTML=`<div class="in">
    ${mascot('cheer')}
    <h2>${pick(PH.fin)}</h2>
    <div class="fin-stats"><div><b>${minutes}</b><small>${plural(minutes,'минута','минуты','минут')}</small></div><div><b>${works}</b><small>${plural(works,'упражнение','упражнения','упражнений')}</small></div><div><b>+${minutes*10}</b><small>звёзд</small></div></div>
    <div class="fin-stats"><div style="grid-column:1/-1"><b>${after.cur} ${plural(after.cur,'день','дня','дней')}</b><small>серия подряд${after.cur>1?', так держать!':''}</small></div></div>
    <div class="lvbox"><b>${lv.n>lvBefore.n?'Новый уровень: ':'Уровень '+lv.n+': '}${lv.name}</b><div class="bar"><i style="width:${pct}%"></i></div><small>${lv.to?`${lv.xp} из ${lv.to} звёзд`:'Максимальный уровень!'}</small></div>
    ${fresh.map(b=>`<div class="fin-badge">${badgeSVG(b)}<div><b>Новый значок: ${b.name}</b><small>${b.desc}</small></div></div>`).join('')}
    <button class="btn" data-a="fin-done">Готово</button></div>`;
  $('#finish').hidden=false;document.body.classList.add('lock');
  confetti();
}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti');c.hidden=false;const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#FFB547','#2FA37F','#F38B97','#FFFFFF','#F2A65A','#9AD8C3'];
  const P=Array.from({length:120},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(t-t0<4200)requestAnimationFrame(f);else{ctx.clearRect(0,0,innerWidth,innerHeight);c.hidden=true}})(t0);
}
function modal(html){$('#modalBox').innerHTML=html;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true}

/* ============ actions ============ */
const ACT={
  tab:b=>{tab=b.dataset.id;if(tab==='home')VIEW={name:'home'};render();window.scrollTo(0,0);haptic('light')},
  home:()=>go({name:'home'}),
  part:b=>{go({name:'part',part:b.dataset.id});haptic('light')},
  library:()=>go({name:'library'}),
  open:b=>{const sub=SUB_BY[b.dataset.id];SS={id:sub.id,min:sub.min,mode:store.settings.mode,pain:'ok'};openSheet();renderStart();$('#panel').scrollTop=0},
  ex:b=>{if(!SS){SS={};openSheet()}renderDetail(b.dataset.id)},
  'sheet-back':()=>{if(SS&&SS.id)renderStart();else closeSheet()},
  'close-sheet':()=>closeSheet(),
  safety:()=>{SS={};openSheet();renderSafety()},
  chip:b=>{const g=b.dataset.g,v=b.dataset.v;SS[g]=g==='min'?Number(v):v;if(g==='mode'){store.settings.mode=v;save()}const top=$('#panel').scrollTop;renderStart();$('#panel').scrollTop=top;haptic('light')},
  start:()=>{
    const sub=SUB_BY[SS.id];const steps=buildPlan(sub,SS.min,SS.mode,SS.pain);
    const meta={id:sub.id,kind:'sub',cat:SS.pain==='bad'?'relax':sub.part};
    beep(523,.05);
    $('#panel').innerHTML='';$('#sheet').hidden=true;SS=null;
    plStart(steps,meta);
  },
  'pl-toggle':()=>plToggle(),
  'pl-next':()=>{if(PL.i<PL.steps.length-1)plLoad(PL.i+1);else plFinish(true)},
  'pl-prev':()=>{if(PL.elapsed-PL.stepStart>3||PL.i===0)plLoad(PL.i);else plLoad(PL.i-1)},
  'pl-sound':()=>{store.settings.sound=!store.settings.sound;save();setSoundIcon();if(!store.settings.sound)try{speechSynthesis.cancel()}catch(e){}},
  'pl-close':()=>{plToggle(true);const m=Math.round(PL.elapsed/60);
    modal(PL.elapsed>=60?`<h3>Закончить тренировку?</h3><p>Ты уже позанималась ${m} ${plural(m,'минуту','минуты','минут')}. Сохраним прогресс?</p><button class="btn" data-a="q-save">Сохранить и закончить</button><button class="btn ghost" data-a="q-cont">Продолжить тренировку</button>`
      :`<h3>Закончить тренировку?</h3><p>Прошло меньше минуты, тренировка не сохранится.</p><button class="btn" data-a="q-cont">Продолжить тренировку</button><button class="btn ghost" data-a="q-drop">Выйти</button>`)},
  'q-save':()=>{closeModal();plFinish(false)},
  'q-cont':()=>{closeModal();plToggle(false)},
  'q-drop':()=>{closeModal();plStop();render()},
  'pl-pain':()=>{plToggle(true);modal(`<h3>Остановимся</h3><p>Пропусти это упражнение. Если боль острая, отдаёт в ногу или появилось онемение, закончи тренировку и обратись к врачу.</p><button class="btn" data-a="p-skip">Пропустить упражнение</button><button class="btn ghost" data-a="p-end">Закончить на сегодня</button>`)},
  'p-skip':()=>{closeModal();let j=PL.i+1;while(j<PL.steps.length&&PL.steps[j].type!=='work')j++;
    if(j>=PL.steps.length){plFinish(false);return}
    const rest=PL.steps[j-1];plToggle(false);plLoad(rest&&rest.type==='rest'?j-1:j)},
  'p-end':()=>{closeModal();if(PL.elapsed>=60)plFinish(false);else{plStop();render()}},
  'fin-done':()=>{$('#finish').hidden=true;$('#finish').innerHTML='';document.body.classList.remove('lock');tab='home';VIEW={name:'home'};render();window.scrollTo(0,0)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACT[b.dataset.a];if(f)f(b,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').hidden&&sheetOpen())closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&PL.timer){PL.last=performance.now();wakeOn()}});
if(TG&&TG.BackButton){try{TG.BackButton.onClick(()=>{
  if(!$('#modal').hidden||PL.timer)return;
  if(sheetOpen()){if(SS&&SS.id&&$('#panel .detail'))renderStart();else closeSheet();return}
  if(VIEW.name!=='home')go({name:'home'});
})}catch(e){}}

$('#brandAv').innerHTML=mascot('calm');
$('#shieldBtn').innerHTML=IC.shield;
render();
loadCloud();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
